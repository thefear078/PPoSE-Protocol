[package]
name = "ppose"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
authors = ["The Fear <https://github.com/thefear078>"]
description = "PPoSE — research prototype: Noise XX, ARQ, onion hops (not Sphinx), rendezvous, invitation web-of-trust"
license = "MIT"
repository = "https://github.com/thefear078/PPoSE-Protocol"
homepage = "https://github.com/thefear078/PPoSE-Protocol"
documentation = "https://github.com/thefear078/PPoSE-Protocol/blob/main/docs/SPECIFICATION.md"
readme = "README.md"
keywords = ["p2p", "noise", "privacy", "udp", "research"]
categories = ["network-programming", "cryptography"]

[dependencies]
blake3 = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
snow = "0.9"
subtle = "2"
thiserror = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]

[lib]
name = "ppose"
path = "src/lib.rs"

[[example]]
name = "admission_demo"
path = "examples/admission_demo.rs"

[[example]]
name = "cover_measurement"
path = "examples/cover_measurement.rs"

[[example]]
name = "udp_chat"
path = "examples/udp_chat.rs"

[[example]]
name = "cli_client"
path = "examples/cli_client.rs"

[[example]]
name = "relay_node"
path = "examples/relay_node.rs"

[profile.release]
lto = true
codegen-units = 1
